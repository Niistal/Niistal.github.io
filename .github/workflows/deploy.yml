# Publish the static portfolio with existing public assets.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate and assemble static portfolio
        run: |
          node --check portfolio/app.js
          node --check portfolio/i18n.js
          grep -q 'http-equiv="Content-Security-Policy"' portfolio/index.html
          if grep -nE '<style|style="| on[a-z]+="' portfolio/index.html; then echo "::error::inline style/handler breaks CSP"; exit 1; fi
          if grep -nE '(src|href)="https?://[^"]*\.(js|css)' portfolio/index.html; then echo "::error::third-party script/style"; exit 1; fi
          if find portfolio public -type f \( -name '*.php' -o -name '.env*' -o -name '*.pem' -o -name '*.key' \) | grep .; then echo "::error::forbidden file type"; exit 1; fi
          test -s portfolio/index.html
          test -s public/images/avatar.webp
          test -s public/cv/CV_Iker_Nistal_2026.pdf
          mkdir -p out
          cp -a public/. out/
          cp -a portfolio/. out/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  deploy:
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
